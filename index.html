<!DOCTYPE html>
<html>
<head>
  <title>loop & Functions</title>
</head>
<body>
  


  <script>
      for (var i=1; i<=10; ++i) {
        document.write('<button onclick="btnRun('+i+');")>'+i+'</button>');
        document.write ('<br/>');

      }
      function btnRun() {
        alert('i')
      }

  </script>
</body>
</html>
