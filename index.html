<!DOCTYPE html>
<html>
<head>
  <title>loop & Functions</title>


  <style>
      .btn{
          background-color: bisque;
          width: 35px;
          height: 35px;
      }
      .btn:hover{
        background-color: brown;
      }

  </style>
</head>
<body>
  


  <script>
    init()

    function init(){
      for(var j=1; j<=10; ++j){
        for (var i=1; i<=10; ++i) {
          var btn = showButton(i*j);
          document.write(btn);
        }
        document.write('</br>')
     }
    }

    function showButton (title){
      return '<button class="btn" onclick="btnRun('+title+');")>'+title+'</button>'
    }

      function btnRun(input) {
        alert(input)
     }

  </script>
</body>
</html>
