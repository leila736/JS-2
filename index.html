<!DOCTYPE html>
<html>
<head>
  <title>loop & Functions</title>


  <style>
      .btn{
          background-color: bisque;
          width: 30px;
      }

  </style>
</head>
<body>
  


  <script>
      for (var i=1; i<=10; ++i) {
        document.write('<button class="btn" onclick="btnRun('+i+');")>'+i+'</button>');
        document.write ('<br/>');

      }
      function btnRun(input) {
        alert(input)
      }

  </script>
</body>
</html>
