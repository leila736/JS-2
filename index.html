<!DOCTYPE html>
<html>
<head>
  <title>loop & Functions</title>


  <style>
      .btn{
          background-color: bisque;
          width: 35px;
          height: 35px;
      }
      .btn:hover{
        background-color: brown;
      }

  </style>
</head>
<body>
  


  <script>
    for(var j=1; j<=10; ++j){
      for (var i=1; i<=10; ++i) {
        document.write('<button class="btn" onclick="btnRun('+i*j+');")>'+i*j+'</button>');
      }
      document.write('</br>')
    }

      function btnRun(input) {
        alert(input)
     }

  </script>
</body>
</html>
